name: Sync Product Company Jobs (100% Free)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Latest Jobs from ATS APIs
        run: |
          python fetch_jobs.py
      - name: Commit and Push Updated jobs.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync jobs [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
